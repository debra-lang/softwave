# TEST-ONLY workflow (branch audio-audit-simtest; kept, never merged). Nothing is signed or uploaded and no secrets are used.
# Focused test of the crash when a filter's type is set during its rebuild: the prototype's first order, the corrected order, and no stereo setting. A simulator run is not proof of iPhone sound quality.
name: Audio filter order test

on:
  push:
    branches: [audio-audit-simtest]
    paths: [.github/simtest/trigger-race]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the simulator app
        run: |
          set -eo pipefail
          SIM=$GITHUB_WORKSPACE/.github/simtest; mkdir -p $GITHUB_WORKSPACE/simapps/orig
          git worktree add $GITHUB_WORKSPACE/../orig d9140ba
          cd $GITHUB_WORKSPACE/../orig/native; npm ci --no-audit --no-fund >/dev/null
          SOFTWAVE_DIAG=0 node build-www.js; node $SIM/inject.js www $SIM/soak.js; npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build | tail -3
          cp -R "$(find dd/Build/Products -name App.app -type d | head -1)" $GITHUB_WORKSPACE/simapps/orig/
          cd $GITHUB_WORKSPACE && tar -czf simapps.tgz simapps
      - uses: actions/upload-artifact@v4
        with:
          name: raceapp
          path: simapps.tgz
          retention-days: 7

  race:
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: race-pinfirst-1, mode: race-pinfirst }
          - { label: race-pinfirst-2, mode: race-pinfirst }
          - { label: race-pinfirst-3, mode: race-pinfirst }
          - { label: race-typefirst-1, mode: race-typefirst }
          - { label: race-typefirst-2, mode: race-typefirst }
          - { label: race-typefirst-3, mode: race-typefirst }
          - { label: race-none-1, mode: race-none }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raceapp
      - name: Run the test
        run: |
          tar -xzf simapps.tgz; S=.github/simtest; chmod +x $S/soak-run.sh
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          $S/soak-run.sh ${{ matrix.label }} simapps/orig out 1500 brown 20 ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.label }}
          path: out/
