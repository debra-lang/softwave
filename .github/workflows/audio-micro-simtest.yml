# TEST-ONLY workflow (branch audio-audit-simtest; kept, never merged). Nothing is signed or uploaded and no secrets are used.
# Retention experiment: which graph shapes make WebKit keep finished filters. A simulator run is not proof of iPhone sound quality.
name: Audio retention experiment

on:
  push:
    branches: [audio-audit-simtest]
    paths: [.github/simtest/trigger-micro]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the simulator app
        run: |
          set -eo pipefail
          SIM=$GITHUB_WORKSPACE/.github/simtest; mkdir -p $GITHUB_WORKSPACE/simapps/orig
          git worktree add $GITHUB_WORKSPACE/../orig d9140ba
          cd $GITHUB_WORKSPACE/../orig/native; npm ci --no-audit --no-fund >/dev/null
          SOFTWAVE_DIAG=0 node build-www.js; node $SIM/inject.js www $SIM/micro.js; npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build | tail -3
          cp -R "$(find dd/Build/Products -name App.app -type d | head -1)" $GITHUB_WORKSPACE/simapps/orig/
          cd $GITHUB_WORKSPACE && tar -czf simapps.tgz simapps
      - uses: actions/upload-artifact@v4
        with:
          name: microapp
          path: simapps.tgz
          retention-days: 7

  micro:
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [base, pin, restart, restartpin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: microapp
      - name: Run the experiment
        run: |
          tar -xzf simapps.tgz; S=.github/simtest; chmod +x $S/micro-run.sh
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          $S/micro-run.sh ${{ matrix.variant }} simapps/orig out '{"variant":"${{ matrix.variant }}","rate":170,"run":270,"idle":240}' 570
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.variant }}
          path: out/
