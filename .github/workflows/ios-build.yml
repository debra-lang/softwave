# Builds the iOS app in the cloud (no Mac needed locally).
#
# UNSIGNED lane (works today, no Apple developer account):
#   GitHub → Actions → "iOS build" → Run workflow.
#   Compiles the full native app and uploads an unsigned .ipa artifact —
#   proof the app builds, and a file you can sign later.
#
# SIGNED lane (after you enroll in the Apple Developer Program):
#   Add the four repository secrets listed in IOS-APP.md, then run the
#   workflow with "signed" set to true. Produces a TestFlight-ready .ipa.
#   This repository is public: a signed .ipa is never published. The run
#   records its identity and hashes, and publishes only a copy encrypted to the
#   backup key (native/ipa-backup-public-key.asc, fingerprint pinned below).
#   Any failure in the record or encryption checks stops the run before the
#   App Store Connect upload.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Signed build (requires Apple secrets — see IOS-APP.md)"
        type: boolean
        default: false
      diag:
        description: "Diagnostic bundle (observer + Diag button). Leave off for a release candidate."
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync Capacitor
        env:
          SOFTWAVE_DIAG: ${{ inputs.diag && '1' || '0' }}
        run: npm run sync

      - name: Assert the bundle mode (release = no diagnostic script; diagnostic = script present)
        run: |
          set -e
          if [ "${{ inputs.diag }}" = "true" ]; then
            test -f www/diag.js && grep -q 'src="diag.js"' www/index.html || { echo "FATAL: diagnostic bundle requested but diag.js is missing"; exit 1; }
            echo "### DIAGNOSTIC bundle (observer + Diag button)" >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -f www/diag.js ] || [ -f www/selftest.js ] || grep -qE 'diag.js|selftest.js' www/index.html; then echo "FATAL: release bundle contains a diagnostic script"; exit 1; fi
            echo "### RELEASE bundle (no diagnostic script)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Build $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' ios/App/App/Info.plist 2>/dev/null || grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj) · commit ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build (unsigned)
        if: ${{ !inputs.signed }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
          APP_PATH=$(find ios/DerivedData/Build/Products -name "App.app" -type d | head -1)
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output && zip -qry FindMyQuietSound-unsigned.ipa Payload

      - name: Import signing certificate
        if: ${{ inputs.signed }}
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p ci $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p ci $KEYCHAIN
          security set-keychain-settings -t 3600 $KEYCHAIN
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci $KEYCHAIN
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

      - name: Build and export signed .ipa
        if: ${{ inputs.signed }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="FMQS App Store" archive
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.findmyquietsound.app</key><string>FMQS App Store</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath ios/App.xcarchive \
            -exportOptionsPlist exportOptions.plist -exportPath output
          mv output/*.ipa output/FindMyQuietSound.ipa

      - name: Record the signed build's identity (log, run summary and backup record)
        if: ${{ inputs.signed }}
        env:
          REQUESTED_MODE: ${{ inputs.diag && 'diagnostic' || 'release' }}
        run: |
          set -euo pipefail
          IPA=output/FindMyQuietSound.ipa
          LIST="$RUNNER_TEMP/ipa-files.txt"
          PLIST="$RUNNER_TEMP/ipa-info.plist"
          unzip -Z1 "$IPA" > "$LIST"
          unzip -p "$IPA" Payload/App.app/Info.plist > "$PLIST"
          plist() { /usr/libexec/PlistBuddy -c "Print $1" "$PLIST"; }
          has() { grep -qxF "Payload/App.app/public/$1" "$LIST"; }
          hash_of() { if has "$1"; then unzip -p "$IPA" "Payload/App.app/public/$1" | shasum -a 256 | cut -d' ' -f1; else echo missing; fi; }
          if has diag.js || has selftest.js; then FOUND=diagnostic; else FOUND=release; fi
          if [ "$FOUND" != "$REQUESTED_MODE" ]; then echo "FATAL: $REQUESTED_MODE build requested but the signed IPA is $FOUND"; exit 1; fi
          mkdir -p backup
          {
            echo "bundle id:     $(plist CFBundleIdentifier)"
            echo "version:       $(plist CFBundleShortVersionString)"
            echo "build:         $(plist CFBundleVersion)"
            echo "mode:          $FOUND"
            echo "commit:        $GITHUB_SHA"
            echo "branch:        $GITHUB_REF_NAME"
            echo "workflow file: $GITHUB_WORKFLOW_SHA"
            echo "run:           $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "ipa bytes:     $(wc -c < "$IPA" | tr -d ' ')"
            echo "ipa sha256:    $(shasum -a 256 "$IPA" | cut -d' ' -f1)"
            for f in index.html app.js assistant.js audio.js diag.js selftest.js; do
              printf '%-14s %s\n' "$f:" "$(hash_of "$f")"
            done
          } > backup/build-record.txt
          { echo "### Signed build record"; echo '```'; cat backup/build-record.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Encrypt the signed IPA to the backup key and verify it
        if: ${{ inputs.signed }}
        env:
          BACKUP_KEY_FINGERPRINT: D9CBC15E2F6754494F90C7C54298C7729F0D90C6
        run: |
          set -euo pipefail
          command -v gpg > /dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet gnupg
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import ipa-backup-public-key.asc
          KEY=$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ { print $10; exit }')
          if [ "$KEY" != "$BACKUP_KEY_FINGERPRINT" ]; then echo "FATAL: the backup public key is not the expected key"; exit 1; fi
          OUT="backup/FindMyQuietSound-$GITHUB_RUN_ID.ipa.gpg"
          gpg --batch --trust-model always --cipher-algo AES256 --compress-algo none \
            --recipient "$KEY" --output "$OUT" --encrypt output/FindMyQuietSound.ipa
          # Nothing is published unless the file is OpenPGP data encrypted to the backup key.
          if [ "$(head -c 2 "$OUT")" = "PK" ] || grep -aqF 'Payload/App.app/' "$OUT"; then echo "FATAL: backup file is not encrypted"; exit 1; fi
          RECIPIENT=$( { gpg --batch --list-packets "$OUT" 2> /dev/null || true; } | awk '/^:pubkey enc packet:/ { print $NF; exit }')
          gpg --batch --with-colons --list-keys | awk -F: '/^(pub|sub):/ { print $5 }' | grep -qxF "${RECIPIENT:-none}" || { echo "FATAL: backup file is not encrypted to the backup key"; exit 1; }
          {
            echo "backup key:    $KEY"
            echo "gpg sha256:    $(shasum -a 256 "$OUT" | cut -d' ' -f1)"
          } | tee -a backup/build-record.txt >> "$GITHUB_STEP_SUMMARY"
          ls backup

      - name: Upload the encrypted IPA and its record (never the IPA itself)
        if: ${{ inputs.signed }}
        uses: actions/upload-artifact@v4
        with:
          name: FindMyQuietSound-signed-encrypted
          path: |
            native/backup/*.ipa.gpg
            native/backup/build-record.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect (TestFlight)
        if: ${{ inputs.signed }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          ASC_P8_BASE64: ${{ secrets.APP_STORE_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f output/FindMyQuietSound.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload unsigned artifact (a signed IPA is never published)
        if: ${{ !inputs.signed }}
        uses: actions/upload-artifact@v4
        with:
          name: FindMyQuietSound-unsigned-ipa
          path: native/output/*.ipa
          retention-days: 30
