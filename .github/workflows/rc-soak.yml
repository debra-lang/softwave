# TEST-ONLY workflow (branch audio-audit-simtest; kept, never merged). Nothing is signed or uploaded and no secrets are used.
# Endurance of the release candidate: Candidate B plus the Ask fixes and the 90% cap, on the sounds not yet soaked on the corrected engine, the earlier ones again, and rapid restarts. A simulator run is not proof of iPhone sound quality.
name: Release candidate soak

on:
  push:
    branches: [audio-audit-simtest]
    paths: [.github/simtest/trigger-rc-soak]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the simulator apps
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; SIM=$W/.github/simtest; mkdir -p $W/simapps
          bash $SIM/prep-rc.sh
          build() {   # $1 = tree, $2 = output name, $3 = SOFTWAVE_DIAG, $4 = script to inject
            cd "$1/native"; [ -d node_modules ] || npm ci --no-audit --no-fund >/dev/null
            SOFTWAVE_DIAG=$3 node build-www.js; node $SIM/inject.js www "$4"
            if [ "$(basename "$4")" = offline-sim3.js ]; then cp $SIM/offline-compare.js www/; cp /tmp/orig.js www/engine-orig.js; cp ../audio.js www/engine-rc.js; fi
            npx cap sync ios
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build | tail -1
            mkdir -p $W/simapps/$2; cp -R "$(find dd/Build/Products -name App.app -type d | head -1)" $W/simapps/$2/
          }
          build $W/../rc rc 0 $SIM/soak.js
          cd $W && tar -czf simapps.tgz simapps
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: simapps.tgz
          retention-days: 7

  soak:
    needs: build
    runs-on: macos-26
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: rc-glass, sound: 'glassrain', min: 90, mode: plain }
          - { label: rc-lapping, sound: 'lapping', min: 90, mode: plain }
          - { label: rc-thunder, sound: 'thunder', min: 90, mode: plain }
          - { label: rc-leaves, sound: 'leaves', min: 90, mode: plain }
          - { label: rc-rain, sound: 'rain', min: 90, mode: plain }
          - { label: rc-fire, sound: 'fire', min: 90, mode: plain }
          - { label: rc-mix, sound: 'rain,fire,glassrain,lapping,ocean', min: 90, mode: plain }
          - { label: rc-cycle, sound: 'rain', min: 90, mode: cycle }
          - { label: rc-quick-1, sound: 'rain', min: 30, mode: quick }
          - { label: rc-quick-2, sound: 'rain', min: 30, mode: quick }
          - { label: rc-quick-3, sound: 'rain', min: 30, mode: quick }
          - { label: rc-quick-4, sound: 'rain', min: 30, mode: quick }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apps
      - name: Run
        run: |
          tar -xzf simapps.tgz; S=.github/simtest; chmod +x $S/*.sh
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          $S/soak-run.sh ${{ matrix.label }} simapps/rc out $(( (${{ matrix.min }} + 12) * 60 )) "${{ matrix.sound }}" ${{ matrix.min }} ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.label }}
          path: out/

